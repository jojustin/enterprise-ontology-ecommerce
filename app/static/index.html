<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ontology Ecommerce</title><style>body{font:16px system-ui,sans-serif;max-width:940px;margin:40px auto;padding:0 18px;background:#f7f9fc;color:#182234}h1{font-size:28px}main{display:grid;grid-template-columns:1fr 1fr;gap:18px}section{background:white;border:1px solid #dfe5ed;border-radius:12px;padding:20px}label{display:block;margin:10px 0 3px;font-size:14px}input{box-sizing:border-box;width:100%;padding:9px;border:1px solid #a9b6c7;border-radius:6px}button{background:#175cd3;color:white;border:0;border-radius:6px;padding:10px 14px;margin-top:12px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eaf0f8;padding:12px;border-radius:8px}footer{margin:20px 0;font-size:13px;color:#5b6675}@media(max-width:650px){main{grid-template-columns:1fr}}</style></head><body><h1>Ontology-driven Ecommerce</h1><p>Products, customers and orders are represented as RDF triples in Apache Jena Fuseki.</p><main><section><h2>Products</h2><button onclick="loadProducts()">Refresh products</button><pre id="products">Click refresh</pre><h3>Add product</h3><form id="productForm"><label>Product ID</label><input name="id" value="Product102" required><label>Name</label><input name="name" value="Monitor" required><label>Price</label><input name="price" type="number" min="0" step="0.01" value="12000" required><button>Add product</button></form></section><section><h2>Create customer</h2><form id="customerForm"><label>Customer ID</label><input name="id" value="Customer102" required><label>Name</label><input name="name" value="Alice" required><label>Email</label><input name="email" value="alice@example.com" required><button>Add customer</button></form><h2>Create order</h2><form id="orderForm"><label>Order ID</label><input name="id" value="Order102" required><label>Customer ID</label><input name="customer_id" value="Customer102" required><label>Product ID</label><input name="product_id" value="Product101" required><button>Create order</button></form></section></main><section style="margin-top:18px"><h2>Results</h2><pre id="result">Ready</pre><a href="/docs">Open API documentation</a></section><footer>Development demonstration only. No user authentication or payment processing.</footer><script>const result=document.querySelector('#result');async function call(path,method='GET',body){try{const response=await fetch(path,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const data=await response.json();if(!response.ok)throw Error(JSON.stringify(data));result.textContent=JSON.stringify(data,null,2);return data}catch(e){result.textContent='Error: '+e.message;return null}}async function loadProducts(){const data=await call('/products');if(data)document.querySelector('#products').textContent=JSON.stringify(data,null,2)}for(const [id,path] of [['productForm','/products'],['customerForm','/customers'],['orderForm','/orders']]){document.getElementById(id).addEventListener('submit',async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));if(id==='productForm')data.price=Number(data.price);await call(path,'POST',data);if(id==='productForm')loadProducts()})}loadProducts()</script></body></html>
